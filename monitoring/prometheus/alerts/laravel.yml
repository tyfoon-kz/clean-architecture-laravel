groups:
  - name: laravel-observability
    rules:
      - alert: LaravelHighErrorRate
        expr: |
          sum(rate(laravel_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(laravel_http_requests_total[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Laravel backend error rate is above 1%.
          description: Check the HTTP error panel, recent deploys and application logs.
          runbook_url: docs/runbooks/product-catalog-high-error-rate.md

      - alert: LaravelHighP95Latency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(laravel_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Laravel backend p95 latency is above 500ms.
          description: Check request rate, database behavior, queue backlog and Octane worker memory.
          runbook_url: docs/runbooks/product-catalog-high-latency.md

      - alert: LaravelQueueBacklogGrowing
        expr: laravel_queue_backlog{queue="default"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Default queue backlog is above 100 jobs.
          description: Check queue workers, failed jobs and job duration.
